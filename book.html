<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>دفتر العلامات الجانبي</title>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f6f7f9;color:#5b636e}</style>
</head>
<body>
<p id="msg">جارٍ تحميل الدفتر…</p>
<script src="assets/config.js"></script>
<script>
// يحمّل تطبيق «الدفتر الجانبي» من قاعدة البيانات نفسها، فيبقى تحت عنوان واحد مع منصة الاختبارات
(async function () {
  const C = window.APP_CONFIG;
  try {
    const r = await fetch(C.SUPABASE_URL + "/rest/v1/rpc/app_html", {
      method: "POST", headers: { apikey: C.SUPABASE_KEY, "Content-Type": "application/json" }, body: "{}"
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const html = await r.json();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById("msg").textContent = "تعذّر تحميل الدفتر. تحقّق من الاتصال ثم حدّث الصفحة.";
  }
})();
</script>
</body>
</html>
