<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c2742">
<title>FGU · Financial Management Student Survey</title>
<link rel="icon" href="logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <img src="logo.webp" alt="" width="44" height="44">
      <div class="brand-text">
        <span class="brand-uni" id="brandUni"></span>
        <span class="brand-course" id="brandCourse"></span>
      </div>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </div>
  <div class="progress">
    <div class="progress-row">
      <div class="progress-meta">
        <span class="progress-step" id="progressStep"></span>
        <span class="progress-pct num" id="progressPct">0%</span>
      </div>
      <div class="progress-track" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>
</header>

<main class="stage" id="stage" aria-live="polite"></main>
<footer class="foot" id="foot"></footer>

<noscript><p style="padding:24px;text-align:center">JavaScript is required to fill in this survey.</p></noscript>
<script src="survey.js"></script>
<script src="app.js"></script>
</body>
</html>
